name: digital_twin_advisor
description: Digital Twin Academic Advisor - Flutter Android App for IT Students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3
  firebase_storage: ^12.3.2
  file_picker: ^8.0.0
  pdf: ^3.10.8
  printing: ^5.13.0
  http: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
